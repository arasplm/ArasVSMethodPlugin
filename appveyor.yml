image: Visual Studio 2022

init:
- git config --global core.autocrlf false

install:
- ps: (new-object Net.WebClient).DownloadString("https://raw.github.com/madskristensen/ExtensionScripts/master/AppVeyor/vsix.ps1") | iex

before_build:
  - ps: |
      $versionInfo = Vsix-IncrementVsixVersion
      $versionInfo | Vsix-UpdateBuildVersion
      $env:APPVEYOR_BUILD_VERSION = $versionInfo.Version
      Vsix-TokenReplacement Aras.VS.MethodPlugin\Properties\AssemblyInfo.cs 'AssemblyFileVersion\("[0-9\.]+"\)' 'AssemblyFileVersion("{version}.0")'

build_script:
  - nuget restore -Verbosity quiet
  - msbuild /p:configuration=Release /p:DeployExtension=false /p:ZipPackageCompressionLevel=normal /v:m

test:
# only assemblies to test
  assemblies:
    only:
      - Aras.VS.MethodPlugin.Tests.dll

after_test:
  - ps: Vsix-PushArtifacts | Vsix-PublishToGallery
